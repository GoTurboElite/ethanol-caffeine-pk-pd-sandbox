name: Prepare cached-navigation release
on:
  push:
    branches: [fix/v1.60-cached-navigation]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Build cached-navigation correction"
            git push origin HEAD:fix/v1.60-cached-navigation
          fi

name: Verify release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: read
jobs:
  numerical-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- public
      - run: npm test
  browser:
    timeout-minutes: 22
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: browsers
        run: npx playwright install --with-deps --only-shell ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:ui
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: node test/pwa-browser.mjs
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: node test/science-browser.mjs
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: node test/live-browser.mjs
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          DEPLOYMENT_URL: ${{ github.event_name == 'push' && 'https://pkpd.goturbo.one/' || '' }}
          DEPLOYMENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: node test/live-browser.mjs
        if: ${{ github.event_name == 'push' && !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          DEPLOYMENT_URL: https://ethanol-caffeine-pk-pd-sandbox.pages.dev/
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test/artifacts
  production-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [numerical-and-build, browser]
    timeout-minutes: 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node scripts/verify-deployment.mjs
      - run: node scripts/verify-deployment.mjs
        env:
          DEPLOYMENT_URL: https://ethanol-caffeine-pk-pd-sandbox.pages.dev/

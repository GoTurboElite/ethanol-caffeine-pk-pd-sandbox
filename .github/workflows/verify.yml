name: Verify release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  numerical-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- public
      - run: npm test
  browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: npm run test:ui
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - run: node test/pwa-browser.mjs
        env:
          TEST_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: test/artifacts
